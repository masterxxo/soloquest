# .github/workflows/deploy.yml
name: Deploy
on:
  push:
    branches: [master]

jobs:
  # Typecheck the whole workspace (api/db/shared/web) first — its own job so a failure
  # is attributed unambiguously, before any tests run.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `nuxt prepare`, which generates the .nuxt types that
      # `nuxt typecheck` needs — so the web typecheck works right after install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  # Unit tests (api/shared) run only after the typecheck job is green.
  test:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  deploy:
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy — web
        run: |
          curl -X GET "https://coolify.rogson.dev/api/v1/deploy?uuid=d7qyzj6v92tuzyycx1wv74p1&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json"

      - name: Trigger Coolify deploy — api
        run: |
          curl -X GET "https://coolify.rogson.dev/api/v1/deploy?uuid=q8o95m9fk3x4tdyg94f0769t&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json"
