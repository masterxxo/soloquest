# .github/workflows/deploy.yml
name: Deploy
on:
  push:
    branches: [master]

jobs:
  # ESLint over every package. Its own job, running in parallel with typecheck, so a lint
  # failure is attributed unambiguously — and it gates the deploy below.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Read the version instead of hardcoding it: `engines.node` in the root
          # package.json is the source of truth (and mirrors mise.toml).
          node-version-file: package.json
          # Caches the pnpm store, so install is a restore rather than a cold download.
          cache: pnpm

      # postinstall runs `nuxt prepare`, which generates `.nuxt/eslint.config.mjs` — the
      # config apps/web/eslint.config.mjs imports. Lint would fail to resolve it otherwise.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # Typecheck the whole workspace (api/db/shared/web) first — its own job so a failure
  # is attributed unambiguously, before any tests run.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      # postinstall runs `nuxt prepare`, which generates the .nuxt types that
      # `nuxt typecheck` needs — so the web typecheck works right after install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  # Unit tests (api/shared) run only after the typecheck job is green.
  test:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  deploy:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy — web
        run: |
          curl -X GET "https://coolify.rogson.dev/api/v1/deploy?uuid=d7qyzj6v92tuzyycx1wv74p1&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json"

      - name: Trigger Coolify deploy — api
        run: |
          curl -X GET "https://coolify.rogson.dev/api/v1/deploy?uuid=q8o95m9fk3x4tdyg94f0769t&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json"
